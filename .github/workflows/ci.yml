name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build tools
        run: python -m pip install "build>=1.2,<2" "twine>=6,<7"
      - name: Build wheel from source distribution
        run: python -m build
      - name: Check package metadata
        run: python -m twine check dist/*
      - name: Install built wheel with public dependencies
        run: python -c "import glob,subprocess,sys; subprocess.check_call([sys.executable,'-m','pip','install',glob.glob('dist/*.whl')[0]+'[dev]'])"
      - name: Check source formatting
        run: python -m ruff format --check src tests tools examples
      - name: Check dependency consistency
        run: python tools/check_dependencies.py
      - name: Test installed package
        run: python -m pytest -q -ra
      - name: Exercise installed CLI outside checkout
        run: python tools/smoke.py
      - name: Run documentation examples
        run: python tools/check_examples.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: binquery-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/*
